name: Monday Price Scraper

on:
  schedule:
    - cron: '0 9 * * 1'  # Runs every Monday at 9:00 AM UTC
  workflow_dispatch:      # Gives you a "Run workflow" button in GitHub to test manually

permissions:
  contents: write         # Required to commit the Excel file back to the repo

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright free-proxy pandas openpyxl
          playwright install chromium --with-deps

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Excel File
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Weekly_Prices.xlsx
          
          # Only commit if the file actually changed/exists
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated price update [skip ci]" && git push)
          
      - name: Upload Debug Screenshots
        if: always() # This runs even if the script fails
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_*.png